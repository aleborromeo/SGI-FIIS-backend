services:
  db_fiis:
    image: postgres:15-alpine
    container_name: sgifiis-postgres-db
    environment:
      POSTGRES_DB: db_fiis_investigacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_fiis_data:/var/lib/postgresql/data
    networks:
      - sgifiis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_fiis_investigacion"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api_fiis:
    build: .
    container_name: sgifiis-backend-api
    ports:
      - "8080:8080"
    env_file:
      - ./fiis/.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db_fiis:5432/db_fiis_investigacion
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
    depends_on:
      db_fiis:
        condition: service_healthy   # Espera a que PostgreSQL esté listo antes de arrancar
    networks:
      - sgifiis-network

volumes:
  postgres_fiis_data:

networks:
  sgifiis-network:
    driver: bridge