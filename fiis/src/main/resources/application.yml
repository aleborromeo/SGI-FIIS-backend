spring:
  application:
    name: fiis
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_fiis_investigacion}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1tesla}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
  messages:
    basename: i18n/shared/messages,i18n/auth/messages,i18n/convocatorias/messages,i18n/projects/messages,i18n/dashboards/messages,i18n/reports/messages,i18n/thesis/messages,i18n/lineas_investigacion/messages,i18n/grupos_investigacion/messages
    use-code-as-default-message: true
    fallback-to-system-locale: true

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Java Mail Sender Config
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:tu_correo@unas.edu.pe}
    password: ${SPRING_MAIL_PASSWORD:tu_contraseña}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Microsoft OAuth2 (Entra ID)
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID:dummy-client-id}
            client-secret: ${AZURE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/azure"
        provider:
          azure:
            authorization-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: email


app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-min-32-chars}
    expiration-ms: 86400000
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

# Debug logging para OAuth2 (quitar en producción)
logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO