spring:
  application:
    name: fiis
  messages:
    basename: i18n/shared/messages,i18n/auth/messages,i18n/convocatorias/messages,i18n/projects/messages,i18n/lineas_investigacion/messages,i18n/grupos_investigacion/messages
    use-code-as-default-message: true
    fallback-to-system-locale: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_fiis_investigacion}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1tesla}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 10000
      max-lifetime: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB       # Tamaño máximo permitido por cada archivo individual
      max-request-size: 10MB     # Tamaño máximo total permitido para toda la petición HTTP
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Java Mail Sender Config
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Microsoft OAuth2 (Entra ID)
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID:dummy-client-id}
            client-secret: ${AZURE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/azure"
        provider:
          azure:
            authorization-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: email

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

app:
  mail:
    mock: ${APP_MAIL_MOCK:true}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-min-32-chars}
    expiration-ms: 86400000
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

# Debug logging para OAuth2 (quitar en producción)
logging:
  level:
    '[org.springframework.security]': INFO
    '[org.springframework.security.oauth2]': INFO
