# =====================================================================
# Configuración para PRUEBAS - No usar en producción
# Provee valores mock para que los tests @WebMvcTest puedan cargar
# el ApplicationContext de Spring Security sin necesitar .env
# =====================================================================

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.max-lifetime=5000
spring.messages.use-code-as-default-message=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_fiis_investigacion}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:12345}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID:dummy-id}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET:dummy-secret}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri=http://localhost/login/oauth2/code/azure
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.azure.user-name-attribute=email

app.jwt.secret=${JWT_SECRET:00000000000000000000000000000000}
app.jwt.expiration-ms=86400000

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:test@sgi-fiis.pe}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.mock=true

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
