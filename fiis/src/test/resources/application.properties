spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.max-lifetime=5000
spring.messages.use-code-as-default-message=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_fiis_investigacion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:test@sgi-fiis.pe}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.mock=true

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
