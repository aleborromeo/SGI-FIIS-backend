# ============================================================
# Propiedades para tests @SpringBootTest.
# El datasource se declara explícito para evitar que Spring Boot 4.x
# use H2 auto-detectado cuando la URL usa placeholders anidados.
# En CI, SPRING_DATASOURCE_URL env var sobreescribe este valor.
# ============================================================

spring.flyway.enabled=false

# Datasource explícito — PostgreSQL local (mismo que docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/db_fiis_investigacion
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# JWT — valor de prueba (mínimo 32 caracteres)
app.jwt.secret=test-secret-key-for-jwt-signing-min-32-chars-sgi-fiis
app.jwt.expiration-ms=86400000

# Mail — desactivado en tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@sgi-fiis.pe
spring.mail.password=test-password
app.mail.mock=true

# Frontend URL
app.frontend-url=http://localhost:3000
