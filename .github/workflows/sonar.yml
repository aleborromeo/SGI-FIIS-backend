name: SonarQube

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    # Levantamos la base de datos para que tus pruebas compilen limpio en Actions
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: db_fiis_investigacion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu'
          
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
          
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make Maven Wrapper Executable
        run: chmod +x fiis/mvnw

      - name: Build and analyze
        working-directory: ./fiis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/db_fiis_investigacion
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 12345
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_FLYWAY_ENABLED: false
          APP_JWT_SECRET: ci-test-secret-key-for-jwt-signing-min-32-characters-long
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "25"
          SPRING_MAIL_USERNAME: ci@sgi-fiis.pe
          SPRING_MAIL_PASSWORD: ci-test-password
          APP_MAIL_MOCK: "true"
          APP_FRONTEND_URL: http://localhost:3000
          MAVEN_OPTS: "-Xmx1024m"
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=aleborromeo_SGI-FIIS-backend