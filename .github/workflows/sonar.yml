name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

jobs:
  sonar:

    name: SonarCloud
    runs-on: ubuntu-latest

    # 1. Levantamos la base de datos para que tus pruebas compilen limpio en Actions
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: db_fiis_investigacion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Make Maven Wrapper Executable
        run: chmod +x fiis/mvnw

      - name: Run SonarCloud Analysis
        working-directory: ./fiis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Variables de entorno para que Spring Boot conecte a la BD del contenedor
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/db_fiis_investigacion
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 12345
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_FLYWAY_ENABLED: false
          APP_JWT_SECRET: ci-test-secret-key-for-jwt-signing-min-32-characters-long
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "25"
          SPRING_MAIL_USERNAME: ci@sgi-fiis.pe
          SPRING_MAIL_PASSWORD: ci-test-password
          APP_MAIL_MOCK: "true"
          APP_FRONTEND_URL: http://localhost:3000
          # Límite de memoria RAM para que Maven no se sature
          MAVEN_OPTS: "-Xmx1024m"
        run: |
          # Primero compilamos y verificamos los tests con la BD activa
          ./mvnw clean verify
          
          # Segundo enviamos el resultado usando el Key en minúsculas que dio éxito local
          ./mvnw sonar:sonar -Dsonar.projectKey=sgi-fiis -Dsonar.organization=sgi-fiis