name: Backend CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: db_fiis_investigacion
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant Maven Wrapper Permission
        run: chmod +x fiis/mvnw

      - name: Build Spring Boot
        working-directory: ./fiis
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/db_fiis_investigacion
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_FLYWAY_ENABLED: false
          JWT_SECRET: ci-test-secret-key-for-jwt-signing-min-32-characters-long
          AZURE_CLIENT_ID: ci-dummy-client-id
          AZURE_CLIENT_SECRET: ci-dummy-client-secret
          AZURE_TENANT_ID: common
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "25"
          SPRING_MAIL_USERNAME: ci@sgi-fiis.pe
          APP_MAIL_MOCK: "true"
          APP_FRONTEND_URL: http://localhost:3000
        run: ./mvnw clean verify -Djdk.attach.allowAttachSelf=true
