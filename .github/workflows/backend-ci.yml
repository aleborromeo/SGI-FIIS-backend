name: Backend CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: db_fiis_investigacion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant Maven Wrapper Permission
        run: chmod +x fiis/mvnw

      - name: Build Spring Boot
        working-directory: ./fiis
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/db_fiis_investigacion
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_FLYWAY_ENABLED: false
          APP_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "25"
          SPRING_MAIL_USERNAME: ci@sgi-fiis.pe
          SPRING_MAIL_PASSWORD: ${{ secrets.CI_MAIL_PASSWORD }}
          APP_MAIL_MOCK: "true"
          APP_FRONTEND_URL: http://localhost:3000
        run: ./mvnw clean verify
