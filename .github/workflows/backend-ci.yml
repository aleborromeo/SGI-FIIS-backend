name: Backend CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: db_fiis_investigacion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant Maven Wrapper Permission
        run: chmod +x fiis/mvnw

      - name: Build, Test & SonarCloud Analysis
        working-directory: ./fiis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/db_fiis_investigacion
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: test
          JWT_SECRET: ci-test-secret-key-for-jwt-signing-min-32-characters-long
          AZURE_CLIENT_ID: ci-dummy-client-id
          AZURE_CLIENT_SECRET: ci-dummy-client-secret
          AZURE_TENANT_ID: common
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "25"
          APP_MAIL_MOCK: "true"
          APP_FRONTEND_URL: http://localhost:3000
          MAVEN_OPTS: "-Xmx1024m"
        run: ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=aleborromeo_SGI-FIIS-backend -Djdk.attach.allowAttachSelf=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: fiis/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: fiis/target/site/jacoco/
          retention-days: 7
