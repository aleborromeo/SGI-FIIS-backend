name: SGI-FIIS Backend CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: db_fiis_investigacion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Maven Wrapper Permission
        run: chmod +x fiis/mvnw

      - name: Build Spring Boot
        working-directory: ./fiis
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/db_fiis_investigacion
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 12345
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_FLYWAY_ENABLED: false
        run: ./mvnw clean verify