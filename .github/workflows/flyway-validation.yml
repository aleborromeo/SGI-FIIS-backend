name: Flyway Validation

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  flyway-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1. Crear el archivo .env en la RAÍZ del proyecto para Docker
      - name: Create .env file
        run: |
          echo "${{ secrets.DOTENV_FILE }}" > .env

      # 2. Convertir el contenido del secreto en variables de entorno del runner (Para Maven)
      - name: Load .env into GitHub Actions Environment
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            # Ignorar líneas vacías o comentarios
            if [[ ! -z "$line" && ! "$line" =~ ^# ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done < .env
          
          # Forzamos a que apunte al puerto del host mapeado por Docker y desactivamos Flyway en el test local de Maven
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/db_fiis_investigacion" >> $GITHUB_ENV
          echo "SPRING_FLYWAY_ENABLED=false" >> $GITHUB_ENV

      # 3. Construir los contenedores
      - name: Build containers
        run: docker compose build

      # 3.5. Crear red externa compartida
      - name: Create shared external docker network
        run: docker network create sgifiis-network-shared

      # 4. Levantar la base de datos y la API
      - name: Start containers
        run: docker compose up -d

      # 5. Esperar a que la base de datos inicie por completo
      - name: Wait for database startup
        run: |
          echo "Esperando que la base de datos y los servicios estén listos..."
          sleep 30

      # 6. Ejecutar los tests (Ahora heredan automáticamente todo el bloque .env de forma segura)
      - name: Run unit and integration tests
        working-directory: ./fiis
        run: mvn clean test

      # 7. Verificar que el contenedor backend siga vivo
      - name: Verify backend container
        run: |
          docker ps
          if [ "$(docker inspect -f '{{.State.Running}}' sgifiis-backend-api-dev)" != "true" ]; then
            echo "El contenedor backend no está ejecutándose."
            docker logs sgifiis-backend-api-dev
            exit 1
          fi

      # 8. Si algo falla en los tests, muestra los logs de Spring
      - name: Show backend logs
        if: failure()
        run: docker logs sgifiis-backend-api-dev

      # 9. Limpieza absoluta
      - name: Stop containers
        if: always()
        run: docker compose down -v